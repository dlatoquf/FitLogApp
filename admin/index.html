<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitLog Admin</title>
  <style>
    :root {
      --green: #00c896;
      --green-dark: #00a87e;
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --text: #f0f2ff;
      --muted: #7b82a8;
      --red: #ff5c5c;
      --blue: #5c9dff;
      --orange: #ff9944;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── 로그인 ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 20px;
    }
    .login-logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .login-logo span { color: var(--green); }
    .login-sub { font-size: 13px; color: var(--muted); }
    .login-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px 28px; width: 300px; display: flex; flex-direction: column; gap: 14px;
    }
    .login-box input {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 16px; color: var(--text); font-size: 18px; text-align: center;
      letter-spacing: 6px; outline: none; width: 100%;
    }
    .login-box input:focus { border-color: var(--green); }
    .login-box button {
      background: var(--green); color: #000; font-weight: 700; font-size: 15px;
      border: none; border-radius: 10px; padding: 13px; cursor: pointer; width: 100%;
      transition: background 0.15s;
    }
    .login-box button:hover { background: var(--green-dark); }
    #login-error { color: var(--red); font-size: 13px; min-height: 18px; text-align: center; }

    /* ── 레이아웃 ── */
    #admin-screen { display: none; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 10; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 24px 20px 20px; font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sidebar-logo span { color: var(--green); }
    .nav { flex: 1; padding: 12px 0; }
    .nav-group-label {
      padding: 14px 20px 6px; font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 20px; font-size: 14px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: all 0.15s; border-radius: 0;
    }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--green); background: rgba(0,200,150,0.08); border-right: 2px solid var(--green); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { padding: 16px 20px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); flex-shrink: 0; }

    .main { margin-left: 220px; padding: 32px; min-height: 100vh; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── 통계 카드 ── */
    .stats { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 22px; flex: 1; min-width: 120px;
    }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--green); }

    /* ── 테이블 ── */
    .toolbar {
      display: flex; gap: 10px; margin-bottom: 16px; align-items: center;
    }
    .search-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; color: var(--text); font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: var(--green); }
    .search-input::placeholder { color: var(--muted); }
    .refresh-btn {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); padding: 10px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--green); }

    .table-wrap {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 13px 16px; text-align: left; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
      background: var(--surface2); border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .td-truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    }
    .badge-trainer { background: rgba(0,200,150,0.15); color: var(--green); }
    .badge-member  { background: rgba(92,157,255,0.15); color: var(--blue); }
    .badge-null    { background: rgba(123,130,168,0.15); color: var(--muted); }
    .badge-active  { background: rgba(0,200,150,0.15); color: var(--green); }
    .badge-deleted { background: rgba(255,92,92,0.15); color: var(--red); }
    .badge-confirmed { background: rgba(0,200,150,0.15); color: var(--green); }
    .badge-open    { background: rgba(92,157,255,0.15); color: var(--blue); }
    .badge-completed { background: rgba(123,130,168,0.15); color: var(--muted); }
    .badge-cancelled { background: rgba(255,92,92,0.15); color: var(--red); }

    .loading, .empty {
      text-align: center; padding: 60px; color: var(--muted); font-size: 14px;
    }
    .updated { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* 페이지네이션 */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 16px;
    }
    .page-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 7px 12px; font-size: 13px; cursor: pointer;
      transition: all 0.15s; min-width: 36px; text-align: center;
    }
    .page-btn:hover { border-color: var(--green); color: var(--green); }
    .page-btn.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }
    .page-btn:disabled { opacity: 0.3; cursor: default; }
    .page-info { font-size: 13px; color: var(--muted); padding: 0 8px; }

    /* ── 모바일 상단 탭바 ── */
    .mobile-topbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .mobile-topbar-logo {
      font-size: 16px; font-weight: 800; padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .mobile-topbar-logo span { color: var(--green); }
    .mobile-tabs {
      display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .mobile-tabs::-webkit-scrollbar { display: none; }
    .mobile-tab {
      flex: 0 0 auto; min-width: 64px; padding: 10px 4px; text-align: center;
      font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s;
    }
    .mobile-tab.active { color: var(--green); border-bottom-color: var(--green); }
    .mobile-tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-topbar { display: block; }
      .main { margin-left: 0; padding: 16px 14px; padding-top: 96px; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 500px; }
      .stat-card { min-width: 100px; padding: 14px 16px; }
      .stat-value { font-size: 22px; }
      .page-title { font-size: 18px; }
      .toolbar { flex-wrap: wrap; }
      .search-input { min-width: 0; }
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">Fit<span>Log</span></div>
  <div class="login-sub">관리자 전용 페이지</div>
  <div class="login-box">
    <input id="pw-input" type="password" placeholder="••••••" maxlength="10" />
    <div id="login-error"></div>
    <button onclick="login()">로그인</button>
  </div>
</div>

<div id="admin-screen">
  <!-- 모바일 상단 탭바 -->
  <div class="mobile-topbar">
    <div class="mobile-topbar-logo">Fit<span>Log</span> <span style="font-size:11px;color:var(--muted);font-weight:500;">Admin</span></div>
    <div class="mobile-tabs">
      <div class="mobile-tab active" onclick="switchTab('users')" data-tab="users"><span class="mobile-tab-icon">👤</span>유저</div>
      <div class="mobile-tab" onclick="switchTab('trainers')" data-tab="trainers"><span class="mobile-tab-icon">🏋️</span>트레이너</div>
      <div class="mobile-tab" onclick="switchTab('members')" data-tab="members"><span class="mobile-tab-icon">🙋</span>회원</div>
      <div class="mobile-tab" onclick="switchTab('payments')" data-tab="payments"><span class="mobile-tab-icon">💳</span>PT결제</div>
      <div class="mobile-tab" onclick="switchTab('schedules')" data-tab="schedules"><span class="mobile-tab-icon">📅</span>스케줄</div>
      <div class="mobile-tab" onclick="switchTab('workout-logs')" data-tab="workout-logs"><span class="mobile-tab-icon">💪</span>운동로그</div>
      <div class="mobile-tab" onclick="switchTab('diet-photos')" data-tab="diet-photos"><span class="mobile-tab-icon">🥗</span>식단</div>
      <div class="mobile-tab" onclick="switchTab('body-logs')" data-tab="body-logs"><span class="mobile-tab-icon">⚖️</span>바디로그</div>
      <div class="mobile-tab" onclick="switchTab('comments')" data-tab="comments"><span class="mobile-tab-icon">💬</span>댓글</div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-logo">Fit<span>Log</span></div>
    <nav class="nav">
      <div class="nav-group-label">유저 관리</div>
      <div class="nav-item active" data-tab="users" onclick="switchTab('users')">
        <span class="nav-icon">👤</span><span>유저</span>
      </div>
      <div class="nav-item" data-tab="trainers" onclick="switchTab('trainers')">
        <span class="nav-icon">🏋️</span><span>트레이너</span>
      </div>
      <div class="nav-item" data-tab="members" onclick="switchTab('members')">
        <span class="nav-icon">🙋</span><span>회원</span>
      </div>
      <div class="nav-item" data-tab="payments" onclick="switchTab('payments')">
        <span class="nav-icon">💳</span><span>PT 결제</span>
      </div>
      <div class="nav-group-label">활동 데이터</div>
      <div class="nav-item" data-tab="schedules" onclick="switchTab('schedules')">
        <span class="nav-icon">📅</span><span>스케줄</span>
      </div>
      <div class="nav-item" data-tab="workout-logs" onclick="switchTab('workout-logs')">
        <span class="nav-icon">💪</span><span>운동 로그</span>
      </div>
      <div class="nav-item" data-tab="diet-photos" onclick="switchTab('diet-photos')">
        <span class="nav-icon">🥗</span><span>식단</span>
      </div>
      <div class="nav-item" data-tab="body-logs" onclick="switchTab('body-logs')">
        <span class="nav-icon">⚖️</span><span>바디로그</span>
      </div>
      <div class="nav-item" data-tab="comments" onclick="switchTab('comments')">
        <span class="nav-icon">💬</span><span>댓글</span>
      </div>
    </nav>
    <div class="sidebar-footer" id="last-updated"></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-title" id="page-title">유저</div>
      <div class="page-sub" id="page-sub"></div>
    </div>
    <div class="stats" id="stats-area"></div>
    <div class="toolbar">
      <input class="search-input" id="search-input" type="text" placeholder="검색..." oninput="onSearch()" />
      <button class="refresh-btn" onclick="loadCurrentTab()">↻ 새로고침</button>
    </div>
    <div class="table-wrap">
      <div id="table-area"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script>
  const API = 'https://fitlog-api.duckdns.org';
  const PAGE_SIZE = 20;
  let pw = '';
  let currentTab = 'users';
  let currentPage = 1;

  // 탭별 캐시된 데이터
  const cache = {};

  const tabMeta = {
    'users':        { title: '유저', sub: '전체 가입 유저 목록', endpoint: 'users' },
    'trainers':     { title: '트레이너', sub: '등록된 트레이너 목록', endpoint: 'trainers' },
    'members':      { title: '회원', sub: '등록된 회원 목록', endpoint: 'members' },
    'payments':     { title: 'PT 결제내역', sub: '전체 결제 내역', endpoint: 'payments' },
    'schedules':    { title: '스케줄', sub: '전체 PT 스케줄', endpoint: 'schedules' },
    'workout-logs': { title: '운동 로그', sub: '전체 운동 기록', endpoint: 'workout-logs' },
    'diet-photos':  { title: '식단', sub: '전체 식단 사진', endpoint: 'diet-photos' },
    'body-logs':    { title: '바디로그', sub: '전체 바디로그 기록', endpoint: 'body-logs' },
    'comments':     { title: '댓글', sub: '전체 댓글 목록', endpoint: 'comments' },
  };

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  function login() {
    const input = document.getElementById('pw-input').value.trim();
    if (input === '364900') {
      pw = input;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadCurrentTab();
    } else {
      document.getElementById('login-error').textContent = '비밀번호가 틀렸습니다.';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    currentPage = 1;

    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.tab === tab);
    });
    document.querySelectorAll('.mobile-tab').forEach(n => {
      n.classList.toggle('active', n.dataset.tab === tab);
    });

    const meta = tabMeta[tab];
    document.getElementById('page-title').textContent = meta.title;
    document.getElementById('page-sub').textContent = meta.sub;
    document.getElementById('search-input').value = '';
    document.getElementById('search-input').placeholder = '검색...';

    if (cache[tab]) {
      renderStats();
      renderTable();
    } else {
      loadCurrentTab();
    }
  }

  async function loadCurrentTab() {
    const tab = currentTab;
    const meta = tabMeta[tab];
    document.getElementById('table-area').innerHTML = '<div class="loading">불러오는 중...</div>';
    document.getElementById('stats-area').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    try {
      const data = await fetch(`${API}/api/admin/${meta.endpoint}?pw=${pw}`).then(r => r.json());
      cache[tab] = Array.isArray(data) ? data : [];
      document.getElementById('last-updated').textContent = new Date().toLocaleTimeString('ko-KR');
      renderStats();
      renderTable();
    } catch {
      document.getElementById('table-area').innerHTML = '<div class="empty">서버 연결 오류</div>';
    }
  }

  function onSearch() {
    currentPage = 1;
    renderTable();
  }

  function renderStats() {
    const el = document.getElementById('stats-area');
    const data = cache[currentTab] || [];
    if (currentTab === 'users') {
      const t = data.filter(u => u.role === 'TRAINER').length;
      const m = data.filter(u => u.role === 'MEMBER').length;
      el.innerHTML = stat('전체', data.length) + stat('트레이너', t) + stat('회원', m);
    } else if (currentTab === 'trainers') {
      const totalMembers = data.reduce((s, t) => s + (t.memberCount || 0), 0);
      el.innerHTML = stat('전체 트레이너', data.length) + stat('총 회원 수', totalMembers);
    } else if (currentTab === 'members') {
      const active = data.filter(m => m.status === 'ACTIVE').length;
      el.innerHTML = stat('전체 회원', data.length) + stat('활성', active);
    } else if (currentTab === 'payments') {
      const total = data.reduce((s, p) => s + (p.amount || 0), 0);
      el.innerHTML = stat('결제 건수', data.length) + stat('총 매출', total.toLocaleString() + '원');
    } else if (currentTab === 'schedules') {
      const confirmed = data.filter(s => s.status === 'CONFIRMED').length;
      el.innerHTML = stat('전체 스케줄', data.length) + stat('확정', confirmed);
    } else if (currentTab === 'workout-logs') {
      el.innerHTML = stat('전체 운동로그', data.length);
    } else if (currentTab === 'diet-photos') {
      el.innerHTML = stat('전체 식단 사진', data.length);
    } else if (currentTab === 'body-logs') {
      el.innerHTML = stat('전체 바디로그', data.length);
    } else if (currentTab === 'comments') {
      const deleted = data.filter(c => c.deleted).length;
      el.innerHTML = stat('전체 댓글', data.length) + stat('삭제됨', deleted);
    } else {
      el.innerHTML = stat('전체', data.length);
    }
  }

  function stat(label, value) {
    return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
  }

  function renderTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const el = document.getElementById('table-area');
    const data = cache[currentTab] || [];

    let filtered;
    if (currentTab === 'users') {
      filtered = data.filter(u => match(u.name, u.email, q));
    } else if (currentTab === 'trainers') {
      filtered = data.filter(t => match(t.name, t.email, q) || (t.gymName||'').toLowerCase().includes(q));
    } else if (currentTab === 'members') {
      filtered = data.filter(m => match(m.name, m.email, q) || (m.trainerName||'').toLowerCase().includes(q));
    } else if (currentTab === 'payments') {
      filtered = data.filter(p => match(p.memberName, p.trainerName, q));
    } else if (currentTab === 'schedules') {
      filtered = data.filter(s => match(s.memberName, s.trainerName, q) || (s.date||'').includes(q));
    } else if (currentTab === 'workout-logs') {
      filtered = data.filter(w => match(w.memberName, w.trainerName, q) || (w.logDate||'').includes(q));
    } else if (currentTab === 'diet-photos') {
      filtered = data.filter(d => (d.memberName||'').toLowerCase().includes(q) || (d.date||'').includes(q) || (d.label||'').toLowerCase().includes(q));
    } else if (currentTab === 'body-logs') {
      filtered = data.filter(b => (b.memberName||'').toLowerCase().includes(q) || (b.logDate||'').includes(q));
    } else if (currentTab === 'comments') {
      filtered = data.filter(c => (c.authorName||'').toLowerCase().includes(q) || (c.content||'').toLowerCase().includes(q) || (c.targetType||'').toLowerCase().includes(q));
    } else {
      filtered = data;
    }

    if (!filtered.length) {
      el.innerHTML = '<div class="empty">데이터 없음</div>';
      renderPagination(0, 1);
      return;
    }

    const { items, total, totalPages } = paginate(filtered);
    el.innerHTML = buildTable(items);
    renderPagination(total, totalPages);
  }

  function buildTable(items) {
    if (currentTab === 'users') {
      return `<table><thead><tr>
        <th>ID</th><th>이름</th><th>이메일</th><th>역할</th><th>가입일</th><th>상태</th>
      </tr></thead><tbody>${items.map(u => `<tr>
        <td style="color:var(--muted)">${u.id}</td>
        <td><b>${u.name||'-'}</b></td>
        <td style="color:var(--muted)">${u.email||'-'}</td>
        <td><span class="badge ${u.role==='TRAINER'?'badge-trainer':u.role==='MEMBER'?'badge-member':'badge-null'}">${u.role||'미설정'}</span></td>
        <td style="color:var(--muted)">${u.createdAt||'-'}</td>
        <td><span class="badge ${u.deleted?'badge-deleted':'badge-active'}">${u.deleted?'삭제됨':'정상'}</span></td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'trainers') {
      return `<table><thead><tr>
        <th>ID</th><th>이름</th><th>이메일</th><th>헬스장</th><th>트레이너 코드</th><th>회원 수</th><th>플랜</th>
      </tr></thead><tbody>${items.map(t => `<tr>
        <td style="color:var(--muted)">${t.id}</td>
        <td><b>${t.name||'-'}</b></td>
        <td style="color:var(--muted)">${t.email||'-'}</td>
        <td>${t.gymName||'-'}</td>
        <td><span class="badge badge-trainer">${t.trainerCode||'-'}</span></td>
        <td>${t.memberCount}</td>
        <td><span class="badge ${t.plan==='PRO'?'badge-trainer':'badge-null'}">${t.plan||'-'}</span></td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'members') {
      return `<table><thead><tr>
        <th>ID</th><th>이름</th><th>이메일</th><th>트레이너</th><th>잔여 PT</th><th>전체 PT</th><th>상태</th>
      </tr></thead><tbody>${items.map(m => `<tr>
        <td style="color:var(--muted)">${m.id}</td>
        <td><b>${m.name||'-'}</b></td>
        <td style="color:var(--muted)">${m.email||'-'}</td>
        <td>${m.trainerName||'-'}</td>
        <td>${m.ptRemaining??'-'}</td>
        <td>${m.ptTotal??'-'}</td>
        <td><span class="badge ${m.status==='ACTIVE'?'badge-active':'badge-deleted'}">${m.status||'-'}</span></td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'payments') {
      return `<table><thead><tr>
        <th>ID</th><th>트레이너</th><th>회원</th><th>금액</th><th>횟수</th><th>메모</th><th>결제일</th><th>상태</th>
      </tr></thead><tbody>${items.map(p => `<tr>
        <td style="color:var(--muted)">${p.id}</td>
        <td>${p.trainerName||'-'}</td>
        <td><b>${p.memberName||'-'}</b></td>
        <td><b style="color:var(--green)">${(p.amount||0).toLocaleString()}원</b></td>
        <td>${p.sessions}회</td>
        <td style="color:var(--muted)" class="td-truncate">${p.memo||'-'}</td>
        <td style="color:var(--muted)">${p.paidAt||'-'}</td>
        <td>${p.status||'-'}</td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'schedules') {
      return `<table><thead><tr>
        <th>ID</th><th>트레이너</th><th>회원</th><th>날짜</th><th>시간</th><th>유형</th><th>상태</th><th>메모</th>
      </tr></thead><tbody>${items.map(s => {
        const badgeCls = s.status==='CONFIRMED'?'badge-confirmed':s.status==='OPEN'?'badge-open':s.status==='COMPLETED'?'badge-completed':'badge-cancelled';
        return `<tr>
        <td style="color:var(--muted)">${s.id}</td>
        <td>${s.trainerName||'-'}</td>
        <td><b>${s.memberName||'-'}</b></td>
        <td style="color:var(--muted)">${s.date||'-'}</td>
        <td style="color:var(--muted)">${s.startTime||'-'} ~ ${s.endTime||'-'}</td>
        <td>${s.sessionType||'-'}</td>
        <td><span class="badge ${badgeCls}">${s.status||'-'}</span></td>
        <td style="color:var(--muted)" class="td-truncate">${s.note||'-'}</td>
      </tr>`;
      }).join('')}</tbody></table>`;

    } else if (currentTab === 'workout-logs') {
      return `<table><thead><tr>
        <th>ID</th><th>트레이너</th><th>회원</th><th>날짜</th><th>유형</th><th>컨디션</th><th>메모</th><th>등록일</th>
      </tr></thead><tbody>${items.map(w => `<tr>
        <td style="color:var(--muted)">${w.id}</td>
        <td>${w.trainerName||'-'}</td>
        <td><b>${w.memberName||'-'}</b></td>
        <td style="color:var(--muted)">${w.logDate||'-'}</td>
        <td>${w.workoutType||'-'}</td>
        <td>${w.conditionScore??'-'}</td>
        <td style="color:var(--muted)" class="td-truncate">${w.memo||'-'}</td>
        <td style="color:var(--muted)">${w.createdAt||'-'}</td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'diet-photos') {
      return `<table><thead><tr>
        <th>ID</th><th>회원</th><th>날짜</th><th>식단 구분</th><th>사진 URL</th>
      </tr></thead><tbody>${items.map(d => `<tr>
        <td style="color:var(--muted)">${d.id}</td>
        <td><b>${d.memberName||'-'}</b></td>
        <td style="color:var(--muted)">${d.date||'-'}</td>
        <td>${d.label||'-'}</td>
        <td style="color:var(--muted)" class="td-truncate"><a href="${d.photoUrl||''}" target="_blank" style="color:var(--blue)">보기</a></td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'body-logs') {
      return `<table><thead><tr>
        <th>ID</th><th>회원</th><th>날짜</th><th>체중(kg)</th><th>체지방률(%)</th><th>근육량(kg)</th><th>메모</th><th>등록일</th>
      </tr></thead><tbody>${items.map(b => `<tr>
        <td style="color:var(--muted)">${b.id}</td>
        <td><b>${b.memberName||'-'}</b></td>
        <td style="color:var(--muted)">${b.logDate||'-'}</td>
        <td>${b.weight??'-'}</td>
        <td>${b.bodyFat??'-'}</td>
        <td>${b.muscleMass??'-'}</td>
        <td style="color:var(--muted)" class="td-truncate">${b.memo||'-'}</td>
        <td style="color:var(--muted)">${b.createdAt||'-'}</td>
      </tr>`).join('')}</tbody></table>`;

    } else if (currentTab === 'comments') {
      return `<table><thead><tr>
        <th>ID</th><th>작성자</th><th>역할</th><th>대상 유형</th><th>날짜</th><th>내용</th><th>등록일</th><th>상태</th>
      </tr></thead><tbody>${items.map(c => `<tr>
        <td style="color:var(--muted)">${c.id}</td>
        <td><b>${c.authorName||'-'}</b></td>
        <td><span class="badge ${c.authorRole==='TRAINER'?'badge-trainer':'badge-member'}">${c.authorRole||'-'}</span></td>
        <td>${c.targetType||'-'}</td>
        <td style="color:var(--muted)">${c.targetDate||'-'}</td>
        <td class="td-truncate">${c.content||'-'}</td>
        <td style="color:var(--muted)">${c.createdAt||'-'}</td>
        <td><span class="badge ${c.deleted?'badge-deleted':'badge-active'}">${c.deleted?'삭제됨':'정상'}</span></td>
      </tr>`).join('')}</tbody></table>`;
    }
    return '<div class="empty">알 수 없는 탭</div>';
  }

  function match(a, b, q) {
    return (a||'').toLowerCase().includes(q) || (b||'').toLowerCase().includes(q);
  }

  function paginate(data) {
    const total = data.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    return { items: data.slice(start, start + PAGE_SIZE), total, totalPages };
  }

  function renderPagination(total, totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;

    let start = Math.max(1, currentPage - 2);
    let end = Math.min(totalPages, start + 4);
    if (end - start < 4) start = Math.max(1, end - 4);

    if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>${start > 2 ? '<span class="page-info">…</span>' : ''}`;
    for (let i = start; i <= end; i++) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    if (end < totalPages) html += `${end < totalPages-1 ? '<span class="page-info">…</span>' : ''}<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;

    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
    html += `<span class="page-info">${total}개</span>`;
    el.innerHTML = html;
  }

  function goPage(p) {
    currentPage = p;
    renderTable();
  }
</script>
</body>
</html>
