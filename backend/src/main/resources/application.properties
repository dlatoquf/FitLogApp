# ===========================
# 타임존 설정 (KST)
# ===========================
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===========================
# DB 설정 (dev/prod 프로필에서 주입)
# ===========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 커넥션 풀
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.initialization-fail-timeout=10000

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===========================
# JPA 설정
# ===========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ===========================
# JPA 디버그 / 통계
# ===========================
spring.jpa.properties.hibernate.generate_statistics=false

# ===========================
# 로깅
# ===========================
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.orm.jpa=WARN
logging.level.p6spy=OFF
logging.level.com.p6spy=OFF

# ===========================
# Jackson 설정
# ===========================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ===========================
# JWT 설정
# ===========================
jwt.secret=${JWT_SECRET}

# ===========================
# Gmail SMTP 설정
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=wearefitlog@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 앱 다운로드 링크
app.download-link=https://fitlog.app/download

# 관리자 이메일
admin.email=wearefitlog@gmail.com
admin.secret=${ADMIN_SECRET}
